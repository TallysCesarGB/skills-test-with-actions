name: Code Smell Detection with AI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**/*.py'
  push:
    branches:
      - code-smells
      - refactored
    paths:
      - 'src/**/*.py'
  workflow_dispatch:

jobs:
  detect-code-smells:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI Code Smell Analysis
        id: inference
        uses: actions/ai-inference@v1
        with:
          prompt-file: './prompts/code_smell_prompt.txt'

      - name: Print AI Analysis Result
        run: |
          echo "=========================================="
          echo "       CODE SMELL ANALYSIS REPORT        "
          echo "=========================================="
          echo "${{ steps.inference.outputs.response }}"

      - name: Comment analysis on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const report = `## 🔍 AI Code Smell Analysis Report

            ${{ steps.inference.outputs.response }}

            ---
            > Generated automatically by [AI Inference Action](https://github.com/marketplace/actions/ai-inference)
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });