name: Code Smell Detection with AI
on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**/*.py'
  push:
    branches:
      - code-smells
      - refactored
    paths:
      - 'src/**/*.py'
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest coverage pytest-cov

      - name: Run tests with coverage
        run: |
          coverage run -m pytest tests/
          coverage report --fail-under=90

  detect-code-smells:
    runs-on: ubuntu-latest
    needs: coverage
    permissions:
      contents: read
      models: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI Code Smell Analysis
        id: inference
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4.1-mini
          max-completion-tokens: 3500
          prompt-file: './prompts/code_smell_prompt.txt'

      - name: Print AI Analysis Result
        run: |
          echo "=========================================="
          echo "       CODE SMELL ANALYSIS REPORT        "
          echo "=========================================="
          echo "${{ steps.inference.outputs.response }}"

      - name: Save AI response to file
        env:
          AI_RESPONSE: ${{ steps.inference.outputs.response }}
        run: |
          printf '%s\n' "$AI_RESPONSE" > ai_response.md

      - name: Comment analysis on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const response = fs.readFileSync('ai_response.md', 'utf8');
            const report = `## 🔍 AI Code Smell Analysis Report\n\n${response}\n\n---\n> Generated automatically by [AI Inference Action](https://github.com/marketplace/actions/ai-inference)`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Evaluate CI/CD quality gate
        run: |
          python3 - <<'PYEOF'
          import re, json, sys

          with open("ai_response.md") as f:
              content = f.read()

          match = re.search(r"```json\s*(\{.*?\})\s*```", content, re.DOTALL)
          if not match:
              print("⚠️  Could not find JSON gate summary block in AI response.")
              print("Failing the gate as a safe default.")
              sys.exit(1)

          try:
              data = json.loads(match.group(1))
          except json.JSONDecodeError as e:
              print(f"⚠️  Failed to parse JSON gate summary: {e}")
              sys.exit(1)

          severity = data.get("by_severity", {})
          gate_status = data.get("gate_status", "FAIL")
          blocking = data.get("blocking_findings", [])

          print("==========================================")
          print("           QUALITY GATE SUMMARY          ")
          print("==========================================")
          print(f"Critical: {severity.get('critical', 0)}")
          print(f"High:     {severity.get('high', 0)}")
          print(f"Medium:   {severity.get('medium', 0)}")
          print(f"Low:      {severity.get('low', 0)}")
          print(f"Gate status: {gate_status}")

          if blocking:
              print("\nBlocking findings:")
              for item in blocking:
                  print(f"  - [{item.get('severity')}] {item.get('smell')} ({item.get('location')})")

          if gate_status == "FAIL":
              print("\n❌ Code quality gate FAILED - Critical/High/Medium severity issues found.")
              sys.exit(1)

          print("\n✅ Code quality gate PASSED.")
          PYEOF