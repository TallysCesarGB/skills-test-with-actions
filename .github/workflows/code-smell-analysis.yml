name: Code Smell Detection with AI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**/*.py'
  push:
    branches:
      - code-smells
      - refactored
    paths:
      - 'src/**/*.py'
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest coverage pytest-cov

      - name: Run tests with coverage
        run: |
          coverage run --source=src --omit=src/bad_code.py --omit=src/good_code.py --omit=src/god_code.py -m pytest tests/
          coverage report --fail-under=90

  detect-code-smells:
    runs-on: ubuntu-latest
    needs: coverage
    permissions:
      contents: read
      models: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI Code Smell Analysis
        id: inference
        uses: actions/ai-inference@v1
        with:
          model: meta/Llama-3.3-70B-Instruct
          max-completion-tokens: 1500
          prompt-file: './prompts/code_smell_prompt.txt'

      - name: Print AI Analysis Result
        run: |
          echo "=========================================="
          echo "       CODE SMELL ANALYSIS REPORT        "
          echo "=========================================="
          echo "${{ steps.inference.outputs.response }}"

      - name: Comment analysis on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const report = `## 🔍 AI Code Smell Analysis Report\n\n${{ steps.inference.outputs.response }}\n\n---\n> Generated automatically by [AI Inference Action](https://github.com/marketplace/actions/ai-inference)`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });